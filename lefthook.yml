pre-commit:
  commands:
    biome:
      run: bun biome check --write --staged
      stage_fixed: true
      glob: "**/*.{js,ts,json,jsonc,css}"
    rustfmt:
      run: cargo fmt --
      stage_fixed: true
      glob: "*.rs"
    clippy:
      run: cargo clippy --fix --allow-dirty --allow-staged -- -D warnings
      stage_fixed: true
      glob: "*.rs"
