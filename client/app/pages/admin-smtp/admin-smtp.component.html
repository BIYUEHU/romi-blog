<div class="space-y-6">
  <div class="bg-bg-surface rounded-lg border border-solid border border-border-strong p-6">
    <div class="flex items-center justify-between mb-6">
      <h2 class="text-xl text-text-base">邮箱设置</h2>
      <div class="flex gap-2">
        <r-button type="primary" (click)="saveSmtpSettings()">保存设置</r-button>
        <r-button (click)="openTestModal()">测试邮件</r-button>
        <r-button (click)="goBack()">返回</r-button>
      </div>
    </div>

    @if (isLoading) {
    <div class="text-center py-8">
      <r-loading label="加载中..." />
    </div>
    } @else {
    <div class="space-y-6">
      <div>
        <h3 class="text-sm font-medium text-text-sub uppercase tracking-wider mb-3">SMTP 设置</h3>
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
          <r-input label="SMTP 服务器" [(ngModel)]="smtpForm.smtpHost" class="w-full" placeholder="smtp.example.com" />
          <r-input label="SMTP 端口" type="number" [(ngModel)]="smtpForm.smtpPort" class="w-full" placeholder="587" />
          <r-input label="SMTP 用户名" [(ngModel)]="smtpForm.smtpUsername" class="w-full" placeholder="user@example.com" />
          <r-input label="SMTP 密码" [(ngModel)]="smtpForm.smtpPassword" class="w-full" placeholder="••••••••" />
          <div class="lg:col-span-2">
            <r-input label="SMTP 邮箱" [(ngModel)]="smtpForm.smtpEmail" class="w-full" placeholder="smtp@example.com" />          </div>
        </div>
      </div>
    </div>
    }
  </div>
</div>

@if (showTestModal) {
<div class="fixed inset-0 bg-black/50 flex items-center justify-center z-50" (click)="showTestModal = false">
  <div class="bg-bg-surface rounded-lg p-6 w-full max-w-lg border border-border-base" (click)="$event.stopPropagation()">
    <h2 class="text-lg font-medium text-text-base mb-4">发送测试邮件</h2>
    <div class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-text-base mb-1">收件人</label>
        <r-input type="email" [(ngModel)]="testMail.to" class="w-full" placeholder="test@example.com" />
      </div>
      <div>
        <label class="block text-sm font-medium text-text-base mb-1">主题</label>
        <r-input type="text" [(ngModel)]="testMail.subject" class="w-full" placeholder="测试邮件" />
      </div>
      <div>
        <label class="block text-sm font-medium text-text-base mb-1">内容 (支持 HTML)</label>
        <r-input type="textarea" [(ngModel)]="testMail.content" class="w-full" rows="6" placeholder="请输入邮件内容..." />
      </div>
    </div>
    <div class="flex justify-end gap-2 mt-6">
      <r-button (click)="showTestModal = false">取消</r-button>
      <r-button type="primary" (click)="sendTestMail()">发送</r-button>
    </div>
  </div>
</div>
}
