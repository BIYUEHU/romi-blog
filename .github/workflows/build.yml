name: Build

on:
  push:
    branches: [ "main" ]
    paths:
      - '**.ts'
      - '**.rs'
      - '**.html'
      - 'Cargo.toml'
      - '**.json'
      - '.github/**/*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        arch: [ x86_64, aarch64 ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true
          components: rustfmt, clippy

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest' && matrix.arch == 'x86_64'
        run: cargo fmt -- --check | git diff --exit-code

      - name: Run clippy
        if: matrix.os == 'ubuntu-latest' && matrix.arch == 'x86_64'
        run: cargo clippy -- -D warnings | git diff --exit-code

      - name: Build backend
        run: cargo build --release

      - name: Upload artifact (Linux)
        if: matrix.os == 'ubuntu-latest' && matrix.arch == 'x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-latest-romichan-server
          path: target/release/romichan

      - name: Upload artifact (Linux aarch64)
        if: matrix.os == 'ubuntu-latest' && matrix.arch == 'aarch64'
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-latest-romichan-server-aarch64
          path: target/release/romichan

      - name: Upload artifact (macOS)
        if: matrix.os == 'macos-latest' && matrix.arch == 'x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: macos-latest-romichan-server
          path: target/release/romichan

      - name: Upload artifact (macOS aarch64)
        if: matrix.os == 'macos-latest' && matrix.arch == 'aarch64'
        uses: actions/upload-artifact@v4
        with:
          name: macos-latest-romichan-server-aarch64
          path: target/release/romichan

      - name: Upload artifact (Windows)
        if: matrix.os == 'windows-latest' && matrix.arch == 'x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: windows-latest-romichan-server
          path: target/release/romichan.exe

      - name: Upload artifact (Windows aarch64)
        if: matrix.os == 'windows-latest' && matrix.arch == 'aarch64'
        uses: actions/upload-artifact@v4
        with:
          name: windows-latest-romichan-server-aarch64
          path: target/release/romichan.exe

      - name: Set up Bun
        if: matrix.os == 'ubuntu-latest' && matrix.arch == 'x86_64'
        uses: oven-sh/setup-bun@v2

      - name: Set up uv
        if: matrix.os == 'ubuntu-latest' && matrix.arch == 'x86_64'
        uses: astral-sh/setup-uv@v5

      - name: Build frontend
        if: matrix.os == 'ubuntu-latest' && matrix.arch == 'x86_64'
        run: |
          bun install
          bun run fix && git diff --exit-code
          bun run build
      #          tar -czf dist.tar.gz dist

      - name: Upload artifact (Frontend)
        if: matrix.os == 'ubuntu-latest' && matrix.arch == 'x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: romichan-client
          path: dist
